# =====================================================================
# GitHub Actions 自动构建发布工作流
# ---------------------------------------------------------------------
# 作用：每当您向 GitHub 推送代码，GitHub 就会自动：
#   1. 找一台 Windows 云服务器，检出您的代码；
#   2. 用 MSBuild 编译整个解决方案（生成汉化版的 exe）；
#   3. 把编译产物打包成 zip；
#   4. 推送到 main 分支时：产物存放在 Actions 运行页面，可随时下载；
#      推送 v 开头的标签（如 v1.0.0）时：自动创建 GitHub Release 并附上 zip。
#
# 如何触发 Release 发布：
#   在本地执行以下两条命令即可（其他什么都不用做）：
#     git tag v1.0.0
#     git push origin v1.0.0
# =====================================================================

name: 构建发布

on:
  # 推送代码到 main 分支时触发
  push:
    branches: [ main ]
    tags: [ 'v*' ]          # 推送 v 开头的标签时也会触发（用于发布 Release）
  # 允许在 GitHub 网页上手动点击触发（Actions 页面 -> 选本工作流 -> Run workflow）
  workflow_dispatch:

jobs:
  build:
    # 必须用 Windows 云服务器（本项目是 WinForms 程序，只能在 Windows 上编译）
    runs-on: windows-latest

    # GITHUB_TOKEN 默认只有“只读”权限，无法创建 Release。
    # 这里显式声明授予“写”权限，工作流末尾的“发布 Release”步骤才能成功。
    permissions:
      contents: write

    steps:
      # 第 1 步：把您仓库里的代码下载到云服务器上
      - name: 检出代码
        uses: actions/checkout@v4

      # 第 2 步：让 msbuild 命令可用（VS 自带的编译器）
      - name: 准备 MSBuild 编译环境
        uses: microsoft/setup-msbuild@v2

      # 第 3 步：编译整个解决方案（Release 版）
      # /restore 会先下载编译所需的 .NET Framework 4.0 引用程序集包
      # （见仓库根目录的 Directory.Build.props，仅云服务器上生效）
      # 编译过程中，项目文件里的 BeforeBuild 会自动把依赖 DLL 嵌入主程序 exe
      - name: 编译解决方案
        run: msbuild "remoteapp-tool\RemoteApp Tool.sln" /restore /t:Rebuild /p:Configuration=Release /p:Platform="Any CPU" /m /nologo /v:m

      # 第 4 步：整理发布文件
      # 注意：Release 直接发布两个 exe 成品（不打包 zip），用户可按需单独下载
      - name: 整理发布文件
        shell: pwsh
        run: |
          # 创建发布文件夹
          New-Item -ItemType Directory -Path publish -Force | Out-Null

          # 复制主程序（已内嵌全部依赖 DLL 的单文件版）
          Copy-Item "remoteapp-tool\bin\Release\RemoteApp Tool.exe" "publish\"

          # 复制命令行工具（RDP 转 MSI）
          Copy-Item "RDP2MSI\bin\Release\RDP2MSI.exe" "publish\"

          Write-Host "发布文件准备完成："
          Get-ChildItem publish

      # 第 5 步：把产物上传到本次 Actions 运行页面
      # （打开仓库 -> Actions -> 点进某次运行 -> 页面底部 Artifacts 区域即可下载）
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: RemoteAppTool-Chinese
          path: publish/

      # 第 6 步：只有推送 v 开头的标签时才会执行 —— 自动创建 GitHub Release
      # 直接把两个 exe 作为附件发布（用户按需下载），使用说明写在 Release 页面
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 先把发布说明写成一个 Markdown 文件（Release 页面会原样显示）
          $version = $env:GITHUB_REF_NAME
          $notes = @"
          # RemoteApp Tool 汉化版 $version

          基于 [kimmknight/remoteapptool](https://github.com/kimmknight/remoteapptool) 汉化。

          ## 下载说明

          | 文件 | 说明 |
          |------|------|
          | **RemoteApp Tool.exe** | 主程序，普通用户只需下载这一个文件 |
          | RDP2MSI.exe | 命令行工具（可选），把 RDP 连接文件转换为 MSI 安装包 |

          ## 主程序使用方法

          1. 下载 RemoteApp Tool.exe，放到任意文件夹
          2. 双击运行即可（已内嵌全部依赖，无需其他文件）
          3. 程序需要管理员权限来修改系统的 RemoteApp 注册表，弹出提示时请点"是"
          4. 系统要求：Windows 7 或更高版本，需安装 .NET Framework 4.0 或更高版本

          ## RDP2MSI.exe 使用方法（可选）

          在命令行中运行：

          ```
          rdp2msi.exe 我的连接.rdp
          ```

          可选开关（可组合使用）：

          | 开关 | 作用 |
          |------|------|
          | /D | 在桌面部署快捷方式 |
          | /S | 在开始菜单部署快捷方式 |
          | /N | 不在开始菜单创建子文件夹（需配合 /S） |
          | /A | 基于应用名称生成稳定的升级代码 |
          | /T | 不在快捷方式标题末尾附加 (remote) 标签 |
          | /U | 按用户安装（默认按机器安装） |

          注意：生成 MSI 需要本机已安装 WiX Toolset v3.x。

          ## 许可证

          MIT License
          "@
          # 去掉 here-string 每行开头的缩进空格后写入文件
          $clean = ($notes -split "`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`n"
          $clean | Set-Content -Path "RELEASE_NOTES.md" -Encoding UTF8

          # 创建 Release：直接上传两个 exe 作为附件
          gh release create "$($env:GITHUB_REF_NAME)" "publish\RemoteApp Tool.exe" "publish\RDP2MSI.exe" `
            --title "RemoteApp Tool 汉化版 $($env:GITHUB_REF_NAME)" `
            --notes-file RELEASE_NOTES.md
